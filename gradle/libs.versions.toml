# Version Catalog: định nghĩa phiên bản dependency dùng chung cho cả project
# Lưu ý nhóm cần kiểm tra khi sync: nếu một phiên bản nào báo không tải được, tra trên
# https://maven.google.com / https://central.maven.org trước khi tự ý đổi.

[versions]
# Bộ công cụ build đã verify trên Maven (10/2026): mở Android Studio mới nhất là sync được
agp = "9.4.0"
kotlin = "2.4.21"
ksp = "2.3.12"
coreKtx = "1.19.1"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.1.4"
recyclerview = "1.4.0"
fragmentKtx = "1.9.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
room = "2.8.5"
glide = "4.16.0"
firebaseBom = "35.1.0"
googleServices = "4.5.0"
securityCrypto = "1.1.0"   # bản stable chính thức
desugar = "2.1.5"
retrofit = "3.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Room (database offline)
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Glide (tải icon danh mục từ URL)
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

# Firebase (Auth Email/Password + Firestore lưu hồ sơ) - dùng BoM để đồng bộ phiên bản
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

# EncryptedSharedPreferences (lưu hạn mức, cặp tiền tệ, công tắc CSV...)
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Retrofit (kéo JSON tỷ giá USD->VND từ open.er-api.com, mục phân hệ v1.4)
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# Desugaring: không thiếu khi dùng java.time với minSdk 24
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
